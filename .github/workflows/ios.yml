name: Build unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - name: Build device IPA
        run: bash ci/build-ipa.sh
      - uses: actions/upload-artifact@v7
        with:
          name: PatrolCheckin-unsigned
          path: |
            dist/PatrolCheckin-unsigned.ipa
            dist/SHA256.txt
            dist/commit.txt
            dist/XcodeProject.zip
          if-no-files-found: error
      - name: Test the local patrol flow on an iPhone simulator
        run: bash ci/simulator.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Simulator-results
          path: |
            dist/Smoke.xcresult
            dist/screenshots
          if-no-files-found: warn

