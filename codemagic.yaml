workflows:
  ios-unsigned:
    name: PatrolCheckin unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 50
    environment:
      xcode: latest
    scripts:
      - name: Build and verify device IPA
        script: bash ci/build-ipa.sh
      - name: Exercise the local patrol flow on iPhone simulator
        script: bash ci/simulator.sh
    artifacts:
      - dist/PatrolCheckin-unsigned.ipa
      - dist/XcodeProject.zip
      - dist/SHA256.txt
      - dist/commit.txt
      - dist/screenshots/*.png
      - dist/Smoke.xcresult
